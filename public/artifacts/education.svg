<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">BBA education evidence cover</title>
  <desc id="description">Fact-led education cover showing a 9.39 cumulative grade-point average, self-reported in Darshil Jain's résumé.</desc>
  <rect width="800" height="800" fill="#1b1b1b"/>
  <rect width="18" height="800" fill="#1ed760"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="122" fill="#b3b3b3" font-size="26" font-weight="700" letter-spacing="4">EDUCATION</text>
    <text x="64" y="286" fill="#f7f7f5" font-size="58" font-weight="800">BBA Business</text>
    <text x="64" y="354" fill="#f7f7f5" font-size="58" font-weight="800">and Industry</text>
    <text x="64" y="566" fill="#1ed760" font-family="monospace" font-size="78" font-weight="700">9.39 CGPA</text>
    <text x="64" y="624" fill="#f7f7f5" font-family="monospace" font-size="26">Cumulative grade-point average</text>
